<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillMarket GUI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="logo">
        <h1>📦 SkillMarket</h1>
      </div>
      <nav>
        <button class="nav-btn active" data-view="skills">
          <span class="icon">📋</span> Skills
        </button>
        <button class="nav-btn" data-view="installed">
          <span class="icon">✅</span> Installed
        </button>
        <button class="nav-btn" data-view="platforms">
          <span class="icon">💻</span> Platforms
        </button>
        <button class="nav-btn" data-view="help">
          <span class="icon">📖</span> Help
        </button>
        <button class="nav-btn" data-view="admin">
          <span class="icon">⚙️</span> Admin
        </button>
      </nav>
      <div class="sidebar-footer">
        <span class="version" id="gui-version">v1.3.12</span>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- Skills 视图 -->
      <div id="view-skills" class="view active">
        <div class="view-header">
          <h2>Available Skills</h2>
          <div class="controls">
            <input type="text" id="search-input" placeholder="🔍 Search skills...">
            <select id="page-size">
              <option value="10">10 per page</option>
              <option value="20" selected>20 per page</option>
              <option value="50">50 per page</option>
            </select>
            <button id="refresh-skills" class="btn btn-secondary">🔄 Refresh</button>
          </div>
        </div>
        <div id="skills-list" class="skills-grid"></div>
        <div id="pagination" class="pagination"></div>
      </div>

      <!-- Installed 视图 -->
      <div id="view-installed" class="view">
        <div class="view-header">
          <h2>Installed Skills</h2>
          <button id="update-all" class="btn btn-primary">🔄 Update All</button>
        </div>
        <div id="installed-list" class="skills-grid"></div>
      </div>

      <!-- Platforms 视图 -->
      <div id="view-platforms" class="view">
        <div class="view-header">
          <h2>Available Platforms</h2>
        </div>
        <div id="platforms-list" class="platforms-list"></div>
      </div>

      <!-- Help 视图 -->
      <div id="view-help" class="view">
        <div class="view-header">
          <h2>Help &amp; Configuration</h2>
        </div>
        <div id="help-content"></div>
      </div>

      <!-- Admin 视图 -->
      <div id="view-admin" class="view">
        <div class="view-header">
          <h2>Admin Dashboard</h2>
          <button id="refresh-admin" class="btn btn-secondary">🔄 Refresh</button>
        </div>
        <div id="admin-stats" class="admin-stats"></div>
        <div id="admin-skills-list" class="admin-skills-list"></div>
      </div>
    </main>

    <!-- Skill 详情模态框 -->
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <button class="modal-close">&times;</button>
        <div id="modal-body"></div>
      </div>
    </div>

    <!-- Toast 通知 -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
