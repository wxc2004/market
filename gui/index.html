<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillMarket GUI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 顶部导航栏 -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-logo">📦 SkillMarket</span>
        <span class="topbar-version" id="gui-version">...</span>
      </div>
      <nav class="topbar-nav">
        <button class="nav-btn active" data-view="skills">📋 Skills</button>
        <button class="nav-btn" data-view="installed">✅ Installed</button>
        <button class="nav-btn" data-view="platforms">💻 Platforms</button>
        <button class="nav-btn" data-view="admin">⚙️ Admin</button>
        <button class="nav-btn" data-view="help">📖 Help</button>
     </nav>
     <div class="lang-switch">
       <select id="lang-select">
         <option value="en">EN</option>
         <option value="zh">中</option>
       </select>
     </div>
   </header>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- Skills 视图 -->
      <div id="view-skills" class="view active">
        <div class="view-header">
          <h2>Available Skills</h2>
          <div class="controls">
            <input type="text" id="search-input" placeholder="🔍 Search skills...">
            <select id="sort-select"></select>
            <select id="platform-filter"></select>
            <select id="page-size">
              <option value="10">10 per page</option>
              <option value="20" selected>20 per page</option>
              <option value="50">50 per page</option>
            </select>
            <button id="refresh-skills" class="btn btn-secondary">🔄 Refresh</button>
          </div>
        </div>
        <div id="skills-list" class="skills-grid"></div>
        <div id="pagination" class="pagination"></div>
      </div>

      <!-- Installed 视图 -->
      <div id="view-installed" class="view">
        <div class="view-header">
          <h2>Installed Skills</h2>
          <button id="update-all" class="btn btn-primary">🔄 Update All</button>
        </div>
        <div id="installed-list" class="skills-grid"></div>
      </div>

      <!-- Platforms 视图 -->
      <div id="view-platforms" class="view">
        <div class="view-header">
          <h2>Available Platforms</h2>
        </div>
        <div id="platforms-list" class="platforms-list"></div>
      </div>

      <!-- Platform 详情视图 -->
      <div id="view-platform-detail" class="view">
        <div class="view-header">
          <button class="btn btn-secondary" onclick="goBackFromPlatformDetail()">← Back to Platforms</button>
        </div>
        <div id="platform-detail-content"></div>
      </div>

      <!-- Help 视图 -->
      <div id="view-help" class="view">
        <div class="view-header">
          <h2>Help &amp; Configuration</h2>
        </div>
        <div id="help-content"></div>
      </div>

      <!-- Admin 视图 -->
      <div id="view-admin" class="view">
        <div class="view-header">
          <h2>Admin Dashboard</h2>
          <button id="refresh-admin" class="btn btn-secondary">🔄 Refresh</button>
        </div>
        <div id="admin-stats" class="admin-stats"></div>
        <div id="admin-skills-list" class="admin-skills-list"></div>
      </div>

      <!-- Skill 详情视图 -->
      <div id="view-skill-detail" class="view">
        <div class="view-header">
          <button class="btn btn-secondary" onclick="goBack()">← Back</button>
        </div>
        <div id="skill-detail-content"></div>
      </div>
    </main>

    <!-- Admin 模态框 -->
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <div id="modal-body"></div>
      </div>
    </div>

    <!-- Toast 通知 -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
